<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FoxLearn - A calm little school for learning to code and speak. 21 courses, 43 lessons, and one fox. No ads, no telemetry, no guilt." />
  <title>FoxLearn — Learn to Code and Speak</title>
  
  <!-- Preconnect to Google Fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Load CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="header"></header>
  
  <!-- Main Content -->
  <main class="main">
    <div class="content">
      <!-- Learn Section (Trails) -->
      <section class="section" id="section-learn"></section>
      
      <!-- Courses Section -->
      <section class="section hidden" id="section-courses"></section>
      
      <!-- Lesson Section -->
      <section class="section hidden" id="section-lesson"></section>
      
      <!-- Progress Section -->
      <section class="section hidden" id="section-progress"></section>
      
      <!-- About Section -->
      <section class="section hidden" id="section-about"></section>
    </div>
  </main>
  
  <!-- Footer -->
  <footer class="footer"></footer>
  
  <!-- Notifications Container -->
  <div class="notifications"></div>
  
  <!-- Load JavaScript -->
  <script src="js/courses.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
